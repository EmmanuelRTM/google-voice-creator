[project]
name = "google-voice-creator"
version = "0.1.0"
description = "MCP server for creating dialogue in your own voice with Gemini 3.8 Live and Gemini 3.8 Flash TTS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "google-genai>=2.25.0",
    "mcp>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[project.scripts]
voice-creator-mcp = "voice_creator_mcp.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_creator_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["voice_creator_mcp"]
known-local-folder = ["conftest", "fakes"]
