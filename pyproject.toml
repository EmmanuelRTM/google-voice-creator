[project]
name = "google-voice-creator"
version = "0.2.0"
description = "Create dialogue in your own voice with Gemini 3.8 Live and Gemini 3.8 Flash TTS: Python library, CLI and MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# The voice core (`voice_creator`) only needs the official Google GenAI SDK.
dependencies = [
    "google-genai>=2.31.0",
]

[project.optional-dependencies]
# MCP server, OAuth resource server, HTTP API and realtime relay (`voice_creator_mcp`).
mcp = [
    "anyio>=4.9",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "pydantic>=2.14",
    "pyjwt[crypto]>=2.10.1",
    "starlette>=1.8",
    "uvicorn>=0.31.1",
]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[project.scripts]
voice-creator = "voice_creator.cli:main"
voice-creator-mcp = "voice_creator_mcp.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_creator", "src/voice_creator_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["voice_creator", "voice_creator_mcp"]
known-local-folder = ["conftest", "fakes"]
